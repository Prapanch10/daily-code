name: Daily Problem

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

jobs:
  daily-task:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: python generate.py

      - run: |
          git config --global user.name "Prapanch"
          git config --global user.email "prapanchr555@gmail.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily auto problem: $(date)"
            git pull origin main --rebase
            git push
          fi

   
